name: JCM data integrity check
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate_data.py'
      - '.github/workflows/jcm-validate.yml'
  schedule:
    - cron: '17,47 7-20 * * *'
      timezone: 'Europe/London'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate locked selections and provider state
        run: python scripts/validate_data.py

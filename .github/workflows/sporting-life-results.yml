name: Sporting Life results updater
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update_sporting_life_results.py
      - tests/sporting_life_results_test.py
      - .github/workflows/sporting-life-results.yml
  schedule:
    # Two long-running watchers avoid the large queue gaps GitHub can apply
    # to high-frequency scheduled workflows. Each watcher polls for 5h 45m.
    - cron: '7 10,16 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: sporting-life-results
  cancel-in-progress: true
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test identity and outcome safeguards
        run: python tests/sporting_life_results_test.py
      - name: Verify Sporting Life access from GitHub
        run: python scripts/update_sporting_life_results.py --probe
      - name: Poll, validate and publish due full results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'JCM Results Updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 70); do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_sporting_life_results.py --write
            node tests/bankroll.cjs
            if ! git diff --quiet -- data; then
              git add data/competition-research-*.json data/result-card-details-*.json data/bet-builder-*.json
              git commit -m 'Update verified Sporting Life race results'
              if git push origin HEAD:main; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
              else
                echo 'Concurrent update detected; the next poll will re-read main and retry.'
              fi
            fi
            if [ "$attempt" -lt 70 ]; then sleep 300; fi
          done

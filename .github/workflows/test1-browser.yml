name: JCM Test 1 Browser Regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test1.js'
      - 'scripts/test1.css'
      - 'tests/test1.spec.cjs'
      - '.github/workflows/test1-browser.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static web server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/jcm-http.log 2>&1 &
      - name: Test 1 browser tests
        run: npx playwright test tests/test1.spec.cjs --browser=chromium --workers=1 --reporter=line
